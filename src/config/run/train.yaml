ngpu: 1
num_workers: 4
pin_memory: true
seed: null
batch_size: 64
num_epochs: 2000
save_every: 100
lr: 0.0004
lr_decay: 1.0
weight_decay: 0.005
dropout_rate: 0.1
loss_dvdw_ratio: 10.0
## Following are relative to `hydra.run.dir`.
checkpoint_dir: ckpt
tensorboard_dir: runs
log_file: ${hydra:job.name}.log
restart_file:

# PyTorch Profiler settings for identifying bottlenecks
enable_profiler: false  # Set to true to enable profiling
profiler_epochs: [1, 2]  # Which epochs to profile (list of epoch numbers)
profiler_output_dir: profiler_output  # Directory to save profiler results

mlflow_uri: "https://mlflow.rayhan.id"
experiment_name: ThesisPIGNet2
run_name: ${now:%Y-%m-%d}_${now:%H-%M-%S}
